# Include inside the existing luyao.blog HTTPS server block.
# The blog root and its asset locations remain untouched.
location = /games/breakout {
    return 308 /games/breakout/;
}

# Reading quota is not a generation attempt and does not use the burst limiter.
location = /games/breakout/api/generation-quota {
    proxy_pass http://127.0.0.1:3107/api/generation-quota;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}

location ^~ /games/breakout/api/ {
    limit_req zone=breakout_generation burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 2k;
    proxy_pass http://127.0.0.1:3107/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 200s;
    add_header Cache-Control "no-store" always;
}

location ^~ /games/breakout/assets/ {
    root /var/www;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}

location ^~ /games/breakout/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
}
